[package]
name = "modama-agent-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
guide-screenshots = ["dep:egui_kittest", "dep:image"]
visual-tests = ["guide-screenshots"]
# End-to-end tests against test-env (tests/e2e_*.rs); they run in its gui-e2e service
e2e = ["dep:egui_kittest"]
inspection = ["eframe/inspection"]
# Offer to start the session helper at sign-in (Windows, HKCU Run entry). Off until there is a
# proper installer for the session executable.
autostart = ["windows/Win32_System_Registry"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["stream", "cookies"] }
reqwest-middleware = { version = "0.5.2", default-features = false }
egui_extras = { version = "0.35.0", features = ["svg"] }
egui_taffy = "0.13"
egui-phosphor = "0.13"
modama-common = { path = "../modama-common" }
modama-session-helper = { path = "../modama-session-helper" }
strsim = "0.11"
time = { version = "0.3.42", features = ["local-offset"] }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3.29"
toml = { workspace = true }
directories = "6.0.0"
egui_kittest = { version = "0.35.0", optional = true, features = ["eframe", "snapshot", "wgpu"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }

[target.'cfg(not(target_vendor = "win7"))'.dependencies]
eframe = "0.35.0"

# AccessKit's windows-core 0.62 bindings import combase.dll, which Windows 7 does not ship.
# An alternative is to vendor/patch windows-core to link these documented APIs from Ole32.dll:
# https://learn.microsoft.com/windows/win32/api/combaseapi/nf-combaseapi-cocreatefreethreadedmarshaler
# https://learn.microsoft.com/windows/win32/api/combaseapi/nf-combaseapi-cotaskmemfree
[target.'cfg(target_vendor = "win7")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.34"
csscolorparser = "0.8.3"
openapi-codegen = { path = "../openapi-codegen" }

[dev-dependencies]
csscolorparser = "0.8.3"
mockito = "1.7.0"
tokio = { workspace = true }

[[test]]
name = "login_visual"
path = "tests/login_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "overview_visual"
path = "tests/overview_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "selection_visual"
path = "tests/selection_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "mount_popup_visual"
path = "tests/mount_popup_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "guide_screenshots_visual"
path = "tests/guide_screenshots_visual.rs"
required-features = ["visual-tests"]

[[bin]]
name = "generate-guide-screenshots"
path = "src/bin/generate-guide-screenshots.rs"
required-features = ["guide-screenshots"]

[lints]
workspace = true
