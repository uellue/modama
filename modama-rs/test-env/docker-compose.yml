services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile-test-runner
    working_dir: /test-env/
    # The agent answers the foreground API for the caller's user, which it looks up from the
    # connection in its own network namespace. So the tests run in the agent's namespace, as the
    # same user as the session helper in `session-1`.
    network_mode: "service:modama-agent-1"
    user: "1000"
    volumes:
      - ./:/test-env:ro
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    depends_on:
      smbdrop:
        condition: service_healthy
      modama-agent-1:
        condition: service_healthy
      modama-agent-2:
        condition: service_healthy
      modama-agent-untrusted:
        condition: service_healthy
      session-1:
        condition: service_healthy
      mgmtinterface-api:
        condition: service_healthy
    stop_signal: SIGKILL

  smbdrop-init:
    image: debian:13-slim
    container_name: smbdrop-init
    command: "bash -c 'rm -rf /data/adhoc/ && mkdir -p /data/adhoc/testproject/session{1,2,3,4,5,6,7}/raw/'"
    volumes:
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    networks:
      - modama-network

  smbdrop:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: smbdrop
    ports:
      # not needed by the tests (they use the compose network); a high port works with rootless podman
      - "127.0.0.1:1446:445"
    volumes:
      - ./certs:/certs:ro
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      - ./target:/usr/src/modama-rs/target/
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    networks:
      - modama-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "http://127.0.0.1:5051/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12
    environment: {}
    #   - "MODAMA_LOG_LEVEL=debug"
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "smbdrop"
      - "--"
      - "--ca-cert=/certs/ca/pub/ca.cert.pem"
      - "--chain=/certs/servers/smbdrop/smbdrop.chain.pem"
      - "--privkey=/certs/servers/smbdrop/smbdrop.priv.pem"
      - "--api-listen=0.0.0.0:5051"
      - "--ws-listen=0.0.0.0:5052"
      - "--token-api-listen=0.0.0.0:5053"

  modama-agent-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-1
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      # read by the build scripts, from outside of the image's build context (modama-rs/)
      - ../../python/mgmtinterface-api/openapi.json:/usr/src/python/mgmtinterface-api/openapi.json:ro
      - ../../mgmtinterface-new/DESIGN.md:/usr/src/mgmtinterface-new/DESIGN.md:ro
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent1.toml"
    ports:
      - "3003:3003"
    healthcheck:
      # no space after the colon: podman-compose joins the arguments into one shell command line
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version:1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  # The session helper of modama-agent-1, mounting via GVfs as user `ingest` (uid 1000).
  session-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for /dev/fuse (GVfs FUSE bridge)
    container_name: session-1
    # same network namespace as the agent, so it can identify the helper's user from the socket
    network_mode: "service:modama-agent-1"
    depends_on:
      modama-agent-1:
        condition: service_healthy
    volumes:
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      # read by the build scripts, from outside of the image's build context (modama-rs/)
      - ../../python/mgmtinterface-api/openapi.json:/usr/src/python/mgmtinterface-api/openapi.json:ro
      - ../../mgmtinterface-new/DESIGN.md:/usr/src/mgmtinterface-new/DESIGN.md:ro
      # the login session's runtime directory, shared with gui-e2e: its session bus and
      # GVfs's sockets, so GIO there sees the mounts made here
      - session-1-run:/run/user/1000
    command:
      - "bash"
      - "-c"
      - |
        set -e
        cargo build --target-dir /usr/src/modama-rs/target/ --release --bin modama-agent-gui
        chown ingest /run/user/1000 && chmod 700 /run/user/1000
        exec runuser -u ingest -- env HOME=/home/ingest XDG_RUNTIME_DIR=/run/user/1000 \
          DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus \
          bash -c 'dbus-daemon --session --address="$$DBUS_SESSION_BUS_ADDRESS" --fork && \
            exec /usr/src/modama-rs/target/release/modama-agent-gui \
            --agent-url http://localhost:3003/ session-helper'
    # healthy once the helper runs, after its build; it connects to the agent right away
    healthcheck:
      test: ["CMD-SHELL", "ls -l /proc/[0-9]*/exe 2>/dev/null | grep -q 'release/modama-agent-gui$'"]
      interval: 5s
      timeout: 5s
      start_period: 10m
      retries: 12

  # The GUI's end-to-end tests (modama-agent-gui/tests/e2e_*.rs), in session-1's login
  # session: same user, network namespace (for the agent) and session bus. Not started by
  # `up`; run.sh runs it after the other tests.
  gui-e2e:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    profiles: ["e2e"]
    network_mode: "service:modama-agent-1"
    volumes:
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      # read by the build scripts, from outside of the image's build context (modama-rs/)
      - ../../python/mgmtinterface-api/openapi.json:/usr/src/python/mgmtinterface-api/openapi.json:ro
      - ../../mgmtinterface-new/DESIGN.md:/usr/src/mgmtinterface-new/DESIGN.md:ro
      - session-1-run:/run/user/1000
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
        read_only: true
    depends_on:
      session-1:
        condition: service_healthy
      mgmtinterface-api:
        condition: service_healthy
    # Built as root like the other services' builds, run as session-1's user. In a target
    # directory of its own: for integration tests cargo also builds the package's binaries,
    # here with the e2e feature, which would replace the one session-1 runs.
    command:
      - "bash"
      - "-c"
      - |
        set -eo pipefail
        tests=$$(cargo test --target-dir /usr/src/modama-rs/target/gui-e2e/ --release -p modama-agent-gui \
          --features e2e --test 'e2e_*' --no-run 2>&1 | tee /dev/stderr \
          | sed -n 's/.*Executable .*(\(.*\))$$/\1/p')
        for test in $$tests; do
          # cargo prints the path relative to /usr/src/modama-rs, the working directory; one
          # test at a time, since they all act on the same agent and resource
          runuser -u ingest -- env HOME=/home/ingest XDG_RUNTIME_DIR=/run/user/1000 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus WGPU_DEBUG=0 \
            "$$test" --nocapture --test-threads=1 "$$@"
        done
      - "gui-e2e"

  modama-agent-2:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-2
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      # read by the build scripts, from outside of the image's build context (modama-rs/)
      - ../../python/mgmtinterface-api/openapi.json:/usr/src/python/mgmtinterface-api/openapi.json:ro
      - ../../mgmtinterface-new/DESIGN.md:/usr/src/mgmtinterface-new/DESIGN.md:ro
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent2.toml"
    healthcheck:
      # no space after the colon: podman-compose joins the arguments into one shell command line
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version:1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  modama-agent-untrusted:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-untrusted
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      # read by the build scripts, from outside of the image's build context (modama-rs/)
      - ../../python/mgmtinterface-api/openapi.json:/usr/src/python/mgmtinterface-api/openapi.json:ro
      - ../../mgmtinterface-new/DESIGN.md:/usr/src/mgmtinterface-new/DESIGN.md:ro
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent-untrusted.toml"
    healthcheck:
      # no space after the colon: podman-compose joins the arguments into one shell command line
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version:1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  mgmtinterface-api:
    hostname: mgmtinterface-api
    build:
      context: ../..
      dockerfile: deploy/mgmtinterface-api/Dockerfile
    environment:
      # plain http, and a throwaway secret, as in deploy/docker-compose.override.yml
      - MODAMA_SESSION_COOKIE_SECURE=false
      - MODAMA_SESSION_SECRET=test-env-only-not-a-real-secret
    volumes:
      # the CA certificate, to trust smbdrop's token service (agent tokens)
      - type: bind
        source: "./certs/ca/pub/"
        target: "/certs/ca/pub/"
        read_only: true
    depends_on:
      smbdrop:
        condition: service_healthy
      permissions:
        condition: service_started
    healthcheck:
      # a shell command line, as podman-compose turns the CMD form into one; the image has no curl
      test: ["CMD-SHELL", "/venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/mgmt-api/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      start_period: 1m
      retries: 12
    networks:
      - modama-network

  permissions:
    hostname: permissions
    restart: always
    volumes:
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    build:
      context: ../..
      dockerfile: deploy/permissions/Dockerfile
    cap_add:
      - LINUX_IMMUTABLE
    networks:
      - modama-network
    environment:
      - FLASK_APP=permissions.server:app
    command: /venv/bin/flask run --without-threads --debug --port 5050 --host 0.0.0.0

networks:
  modama-network:
    driver: bridge

volumes:
  # tmpfs like a real /run/user/<uid>, shared by session-1 and gui-e2e; gone with the stack
  session-1-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
