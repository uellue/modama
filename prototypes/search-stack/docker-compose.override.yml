# Test deployment, loaded by `docker compose` together with docker-compose.yml (as in
# deploy/): ports on 127.0.0.1 for looking around, test data in a volume, and the e2e
# test, which writes the test tree, starts harvests and injects faults into the
# warehouse (with the admin credentials of testconf/, mounted with this folder).
services:
  crawler:
    # the e2e test crawls here and waits for the harvests it starts
    env_file:
      - ${MODAMA_SECRETS_DIR:?see README.md}/chain.env
      - ${MODAMA_SECRETS_DIR:?see README.md}/crawler-airflow.env
    volumes:
      - testdata:/data
      - ./:/e2e:ro
    ports:
      - "127.0.0.1:7654:7654"

  crawl-timer:
    volumes:
      - testdata:/data:ro

  airflow-api-server:
    ports:
      - "127.0.0.1:8081:8080"

  search-api:
    ports:
      - "127.0.0.1:8000:8000"

  matchmaker:
    ports:
      - "127.0.0.1:3000:3000"

  opensearch:
    ports:
      - "127.0.0.1:9200:9200"

volumes:
  testdata:
