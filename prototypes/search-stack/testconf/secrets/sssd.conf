# sssd of the test deployment: owners' names from the test directory (service ldap, built
# from deploy/ldap), the tree of deploy/testconf/secrets/sssd.conf. Name lookups only (nss,
# no pam), and plain LDAP inside the stack's network, without StartTLS.
# The bind password is the test directory's test value (docs/guide/src/development.md).
[sssd]
services = nss
domains = iff.kfa-juelich.de
config_file_version = 2

[domain/iff.kfa-juelich.de]
id_provider = ldap
# The test directory has the memberOf and member attributes of FreeIPA, but not its schema
ldap_schema = rfc2307bis
ldap_uri = ldap://ldap
ldap_default_bind_dn = uid=ldapbind,cn=sysaccounts,cn=etc,dc=iff,dc=kfa-juelich,dc=de
ldap_default_authtok = bind-test-password
ldap_search_base = cn=accounts,dc=iff,dc=kfa-juelich,dc=de
ldap_user_search_base = cn=users,cn=accounts,dc=iff,dc=kfa-juelich,dc=de
ldap_group_search_base = cn=groups,cn=accounts,dc=iff,dc=kfa-juelich,dc=de
# sssd 2.10 starts TLS for the bind on its own unless told not to; the test directory has
# no certificate here, so it refuses ("unsupported extended operation") and sssd goes
# offline (change owner-names-in-the-search-stack, design D4)
ldap_id_use_start_tls = false
enumerate = false
cache_credentials = false
ldap_id_mapping = false
use_fully_qualified_names = false
