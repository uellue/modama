# RabbitMQ settings on top of the image's (mounted into /etc/rabbitmq/conf.d/).
#
# How long a delivery may stay unacknowledged before the broker closes the consumer's
# channel: 48 hours instead of RabbitMQ's 30 minutes. Celery under Airflow acknowledges
# a task when it ends, and tasks on the default queue run for hours: the harvest (5 h on
# staging) and the harvest DAG's wait for the indexing run (over 6 h on staging, at most
# its execution_timeout of 1 day). When the timeout closed the channel, the default
# worker stopped consuming until that task ended (staging finding F17,
# python/crawler/design/field-tests/search-stack-staging-findings.md; reproducer in
# consumer-timeout/). RabbitMQ advises a high value over switching the check off.
consumer_timeout = 172800000
