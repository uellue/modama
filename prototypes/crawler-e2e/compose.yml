# End-to-end test: modama crawler (OAI-PMH) -> EOSC harvester -> metadata warehouse -> search.
# The warehouse stack is the unmodified upstream compose of the submodule; only settings are overridden
# (warehouse.e2e.yml, warehouse.env). See README.md.
name: crawler-e2e

include:
  - path:
      - ../EOSC-Data-Commons/metadata-warehouse/docker-compose.yml
      - ../EOSC-Data-Commons/metadata-warehouse/docker-compose.override.yml.template
      - ./warehouse.e2e.yml
    project_directory: ../EOSC-Data-Commons/metadata-warehouse
    env_file: ./warehouse.env

services:
  crawler:
    build:
      context: ../../python/crawler
      dockerfile: ../../prototypes/crawler-e2e/Dockerfile
      additional_contexts:
        chain: ../../python/search-chain
    command: modama-crawler serve
    # the chain tool's read-only credentials, generated by ./e2e.sh setup
    env_file: chain.env
    environment:
      OAI_BIND: 0.0.0.0
      OAI_BASE_URL: http://crawler:7654/oai
      MODAMA_DATA_ROOT: /data
      MODAMA_CRAWLER_DB: modama_crawler
      POSTGRES_ADMIN: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_ADDRESS: crawler-db
      POSTGRES_PORT: "5432"
    volumes:
      - e2e-data:/data
      - ./:/e2e:ro
    ports:
      - "127.0.0.1:7654:7654"
    depends_on:
      crawler-db:
        condition: service_healthy
    networks:
      - warehouse-backend

  crawler-db:
    image: postgres:17
    environment:
      POSTGRES_DB: modama_crawler
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modama_crawler"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warehouse-backend

volumes:
  e2e-data:
