# Overrides of the upstream warehouse compose, relative to the warehouse directory.
services:
  search-api:
    image: ghcr.io/eosc-data-commons/data-commons-search:0.10.2
    # dummy keys instead of the developer's real ones
    env_file: !override
      - ../../crawler-e2e/keys.e2e.env
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - ZENODO_SEARCH_ENABLED=false
      - RATE_LIMITING_ENABLED=false
      - OPENSEARCH_INDEX=${INDEX_NAME}
      # upstream passes no database settings; the defaults (postgres/postgres) fail. appdb is created by e2e.sh reset,
      # the search API creates its tables itself (metadata-warehouse issue #151)
      - POSTGRES_USER=${POSTGRES_ADMIN}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=appdb

  transform:
    env_file: !override
      - ../../crawler-e2e/keys.e2e.env

  airflow-worker-transform:
    env_file: !override
      - ../../crawler-e2e/keys.e2e.env

  # upstream's healthcheck asks port 8974, which Airflow only opens with this setting
  airflow-scheduler:
    environment:
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
