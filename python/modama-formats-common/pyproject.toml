[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama-formats-common"
description = "Common file formats for the modama crawler (images, Python data science, office, text, structured data): recognition and metadata extraction"
license = {file = "LICENSE"}
requires-python = ">=3.14"
version = "0.0.1.dev0"
dependencies = [
    # Each part adds the libraries it reads its formats with
    "modama-crawler",
    # structured: XML of untrusted origin; current release on PyPI 2026-11-12, pure Python
    "defusedxml==0.7.1",
    # structured: YAML with the safe loader; current release on PyPI 2026-11-12, cp314 manylinux wheel with libyaml
    "PyYAML==6.0.3",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.entry-points."modama.formats"]
common = "modama_formats_common:COLLECTION"

[tool.setuptools.package-data]
"*" = ["*.xml", "*.toml", "*.json", "LICENSE*"]
