[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama-formats-common"
description = "Common file formats for the modama crawler (images, Python data science, office, text, structured data): recognition and metadata extraction"
license = {file = "LICENSE"}
requires-python = ">=3.14"
version = "0.0.1.dev0"
dependencies = [
    # Each part adds the libraries it reads its formats with
    "modama-crawler",
    # pydata: h5py for HDF5, NeXus, HyperSpy and MATLAB 7.3; nbformat for
    # notebooks; SciPy for MATLAB 4 and 5 (matfile_version, whosmat); NumPy
    # pinned exactly for its private numpy.lib._format_impl._read_array_header,
    # the one reader of all three .npy header versions
    "h5py==3.16.0",
    "nbformat==5.11.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    # image: TIFF tags and vendor blocks (2026.11.8 of 2026-11-08, BSD-3-Clause; brings NumPy)
    "tifffile==2026.11.8",
    # image: PNG, JPEG, BMP, GIF, WEBP headers and EXIF (13.0.0 of 2026-10-16, MIT-CMU)
    "pillow==13.0.0",
    # image and structured: SVG, XML from anyone (0.7.1, PSF-2.0); office: XML
    # parts of OOXML and ODF packages and XMP
    "defusedxml==0.7.1",
    # office: legacy Word, PowerPoint, Excel property sets (OleMetadata's names)
    "olefile==0.47",
    # office: workbook sheets and their dimensions, read-only mode (reads shared
    # strings; not called when a part of cell data is over 16 MiB)
    "openpyxl==3.1.5",
    # office: PDF Info and XMP; the extra brings cryptography (unpinned) for AES-encrypted files
    "pypdf[crypto]==7.0.1",
    # structured, text: YAML with the safe loader (yamldoc.py); current release on PyPI 2026-11-12, cp314 manylinux wheel with libyaml
    "PyYAML==6.0.3",
    # text: pinned exactly, as the fixtures' recorded results (expected/) and the
    # docutils-written fixtures depend on the readers' versions.
    # Markdown, with its front matter plugin
    "markdown-it-py==4.3.0",
    "mdit-py-plugins==0.7.0",
    # text: reStructuredText
    "docutils==0.23",
    # text: LaTeX
    "pylatexenc==2.11",
    # text: BibTeX
    "bibtexparser==2.1.0",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.entry-points."modama.formats"]
common = "modama_formats_common:COLLECTION"

[tool.setuptools.package-data]
"*" = ["*.xml", "*.toml", "*.json", "LICENSE*"]
