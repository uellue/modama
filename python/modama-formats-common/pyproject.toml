[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama-formats-common"
description = "Common file formats for the modama crawler (images, Python data science, office, text, structured data): recognition and metadata extraction"
license = {file = "LICENSE"}
requires-python = ">=3.14"
version = "0.0.1.dev0"
dependencies = [
    # Each part adds the libraries it reads its formats with
    "modama-crawler",
    # image: TIFF tags and vendor blocks (2026.11.8 of 2026-11-08, BSD-3-Clause; brings NumPy)
    "tifffile==2026.11.8",
    # image: PNG, JPEG, BMP, GIF, WEBP headers and EXIF (13.0.0 of 2026-10-16, MIT-CMU)
    "pillow==13.0.0",
    # image and structured: SVG, XML from anyone (0.7.1, PSF-2.0)
    "defusedxml==0.7.1",
    # structured, text: YAML with the safe loader (yamldoc.py); current release on PyPI 2026-11-12, cp314 manylinux wheel with libyaml
    "PyYAML==6.0.3",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.entry-points."modama.formats"]
common = "modama_formats_common:COLLECTION"

[tool.setuptools.package-data]
"*" = ["*.xml", "*.toml", "*.json", "LICENSE*"]
