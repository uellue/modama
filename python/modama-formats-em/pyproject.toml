[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama-formats-em"
description = "Electron microscopy formats for the modama crawler: recognition and metadata extraction"
license = {file = "LICENSE"}
requires-python = ">=3.14"
version = "0.0.1.dev0"
dependencies = [
    "defusedxml",
    "modama-crawler",
    # Pinned exactly: private modules, which may change in any release. merlin
    # imports rsciio.quantumdetector._api (MIBProperties); dm and
    # k2is import rsciio.digitalmicrograph._api (DigitalMicrographReader,
    # ImageObject), and dm.first_image repeats file_reader's steps (0.15.0), as
    # test_first_image_is_what_file_reader_gives checks. The extra blockfile
    # brings scikit-image, which rsciio.blockfile imports (decision 227);
    # blockfile imports rsciio.utils._date_time (serial_date_to_datetime);
    # de imports rsciio.mrc._api (read_de_metadata_file)
    "rosettasciio[blockfile]==0.15.0",
    # mrc: CCP-EM's reader, the field's; pinned exactly as mrc reads the header
    # with mrcfile.mrcinterpreter.MrcInterpreter on a buffer of its 1024 bytes
    # and an FEI record (FEI1, FEI2) with mrcfile.dtypes.get_ext_header_dtype.
    # 1.5.4 is the current release (PyPI, looked up 2026-11-13; of 2025-01-22),
    # a pure-Python wheel
    "mrcfile==1.5.4",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.entry-points."modama.formats"]
em = "modama_formats_em:COLLECTION"

[tool.setuptools.package-data]
"*" = ["*.xml", "*.toml", "*.json", "LICENSE*"]
