[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama-formats-em"
description = "Electron microscopy formats for the modama crawler: recognition and metadata extraction"
license = {file = "LICENSE"}
requires-python = ">=3.14"
version = "0.0.1.dev0"
dependencies = [
    "defusedxml",
    "modama-crawler",
    # Pinned exactly: private modules, which may change in any release. merlin
    # imports rsciio.quantumdetector._api (MIBProperties); dm and
    # k2is import rsciio.digitalmicrograph._api (DigitalMicrographReader,
    # ImageObject), and dm.first_image repeats file_reader's steps (0.15.0), as
    # test_first_image_is_what_file_reader_gives checks
    "rosettasciio==0.15.0",
    # Imported by rsciio.blockfile (RosettaSciIO's extra "blockfile"), which
    # the block file format reads the header with; pinned exactly as
    # rosettasciio (decision 227)
    "scikit-image==0.26.0",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.entry-points."modama.formats"]
em = "modama_formats_em:COLLECTION"

[tool.setuptools.package-data]
"*" = ["*.xml", "*.toml", "*.json", "LICENSE*"]
