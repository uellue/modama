[workspace]
purpose = "representative"
validity = "vendor-written: a DigitalMicrograph workspace saved by Gatan Microscopy Suite on 2026-11-12 (@weber, open item 155), unchanged: the DM4 header and only root tags, no ImageList (File count 2, File name 0 and 1 with Windows paths to two DM4 images in a folder beside it, Frame 0 and 1, Window 0 and 1, Workspace name); read by rosettasciio 0.15.0 on 2026-11-12. The two images it names are not included and need not exist: the description lists the names as the file holds them. A workspace saved with 'only unsaved data' has the same tags, apart from its name"
licence = "MIT (LICENSE.fixtures beside this file)"
source = "@weber's exemplary_workspace.dmw (846 bytes), made for this purpose on 2026-11-12, sha256 33be52abb9ac4f5388db2e731549fe52f40c00260fc1b78150ea03606d6cfa7e, unchanged"

[compressed_workspace]
purpose = "representative"
validity = "composed: a ZIP laid out as Gatan Microscopy Suite writes a compressed workspace (structure observed on @weber's exemplary_workspace.dmwx, 2026-11-12, from its first local header and central directory: <name>/<name>.dmw first, then the directory <name>/files/ and the images, all deflated), of two fixtures here: the workspace of fixture workspace, unchanged, and the vendor-written DM4 image of cl_image_dm4, unchanged, as its one image. The workspace names two other images (GMS's own .dmw inside a .dmwx is a different, smaller file); the archive's members are the composed ones"
licence = "GPL-3.0-or-later for the image, MIT for the workspace (LICENSE.fixtures beside this file)"
source = "modama_formats_em.dm.tests.generate:compressed_workspace, from the fixtures workspace and cl_image_dm4"
generator = "modama_formats_em.dm.tests.generate:compressed_workspace"

