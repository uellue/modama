# Alembic's own command line for the crawler's database, from any directory:
# `alembic -c python/crawler/alembic.ini history`, `… revision`, `… downgrade`.
# `modama-crawler migrate` does not read this file. The connection comes from
# the crawler's environment (MODAMA_CRAWLER_DB, POSTGRES_*), see README.md.

[alembic]
script_location = %(here)s/src/modama_crawler/migrations
path_separator = os
# one file per revision, named after its id: schema.py reads the ids from the names
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic,modama_crawler

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# env.py's line while it waits for the crawl lock
[logger_modama_crawler]
level = INFO
handlers =
qualname = modama_crawler

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
